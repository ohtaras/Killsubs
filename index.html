  {n:"ExpressVPN",     e:"🛡", c:"other", p:8.32,  l:"$8.32",  d:"m", tip:"My Account > Manage Subscription > Cancel. Email confirmation needed.", u:"https://www.expressvpn.com/setup"},
  {n:"Duolingo Plus",  e:"🦉", c:"other", p:6.99,  l:"€6.99",  d:"e", tip:"Profile > Settings > Cancel. No dark patterns here.", u:"https://www.duolingo.com/settings/plus"}
];

var CN = {streaming:"Streaming",music:"Music",work:"Work & Tools",gaming:"Gaming",social:"Social & Dating",health:"Health & Fitness",news:"News & Reading",other:"Other"};
var CO = ["streaming","music","work","gaming","social","health","news","other"];
var SC = {streaming:"#4361ee",music:"#7b2ff7",work:"#ff7b00",gaming:"#1db954",social:"#e91e8c",health:"#00b09b",news:"#607d8b",other:"#795548"};
var DC = {e:"de",m:"dm",h:"dh",n:"dn"};
var DL = {e:"Easy",m:"Medium",h:"Hard",n:"Nightmare"};

var af = "all";

function doCalc() {
  function g(id) { var el = document.getElementById(id); return el ? (parseFloat(el.value) || 0) : 0; }
  var t = g("c1") + g("c2") + g("c3") + g("c4");
  var y = t * 12;
  document.getElementById("rmo").textContent = "\u20AC" + Math.round(t);
  document.getElementById("ryr").textContent = "\u20AC" + Math.round(y);
  document.getElementById("rcf").textContent = Math.floor(y / 3.5) + " \u2615";
}

function setF(f, btn) {
  af = f;
  var all = document.querySelectorAll(".fp");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("on");
  btn.classList.add("on");
  doRender();
}

function doRender() {
  var q = (document.getElementById("q").value || "").toLowerCase().trim();
  var list = [];
  for (var i = 0; i < S.length; i++) {
    var s = S[i];
    var mq = !q || s.n.toLowerCase().indexOf(q) >= 0;
    var mf = af === "all" ? true : af === "nightmare" ? s.d === "n" : s.c === af;
    if (mq && mf) list.push(s);
  }
  list.sort(function(a, b) { return a.n < b.n ? -1 : a.n > b.n ? 1 : 0; });
  document.getElementById("cnt").textContent = list.length;

  var wrap = document.getElementById("content");
  if (!list.length) {
    wrap.innerHTML = '<div class="empty">Nothing found. Try a different search.</div>';
    return;
  }

  var showG = (af === "all" || af === "nightmare");
  var html = "";

  if (showG) {
    var grp = {};
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (!grp[s.c]) grp[s.c] = [];
      grp[s.c].push(s);
    }
    for (var ci = 0; ci < CO.length; ci++) {
      var cat = CO[ci];
      if (!grp[cat]) continue;
      html += '<div class="cat-hdr">' + CN[cat] + '</div><div class="grid">';
      for (var j = 0; j < grp[cat].length; j++) html += card(grp[cat][j]);
      html += '</div>';
    }
  } else {
    html = '<div class="grid">';
    for (var i = 0; i < list.length; i++) html += card(list[i]);
    html += '</div>';
  }

  wrap.innerHTML = html;
}

function card(s) {
  var col = SC[s.c] || "#999";
  var dc  = DC[s.d] || "de";
  var dl  = DL[s.d] || "";
  var tid = "t" + s.n.replace(/\W/g, "");
  return '<div class="card">'
    + '<div class="stripe" style="background:' + col + '"></div>'
    + '<div class="clogo">' + s.e + '</div>'
    + '<div class="cname">' + s.n + '</div>'
    + '<div class="cprice">' + s.l + '/mo</div>'
    + '<div class="cnote">monthly</div>'
    + '<div class="dbadge ' + dc + '">' + dl + '</div>'
    + '<button class="tip-btn" onclick="tog(\'' + tid + '\')" type="button">💡 Cancel tip</button>'
    + '<div class="tip-txt" id="' + tid + '">' + s.tip + '</div>'
    + '<a href="' + s.u + '" target="_blank" rel="noopener" class="kill" onclick="kd(this)">Cancel Now</a>'
    + '</div>';
}

function tog(id) {
  var el = document.getElementById(id);
  if (el) el.classList.toggle("open");
}

function kd(btn) {
  btn.textContent = "Done! Check email";
  btn.classList.add("done");
  setTimeout(function() { btn.textContent = "Cancel Now"; btn.classList.remove("done"); }, 2500);
}

doRender();
</script>
</body>
</html>
